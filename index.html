
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="4; url=https://www.toolboxridderkerk.nl/stemtool/?dark=1">
  <title>Doorverwijzing naar de Stemtool</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101a16;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      padding: 32px;
      max-width: 600px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      margin-bottom: 24px;
    }

    p {
      font-size: 22px;
      line-height: 1.6;
    }

    .succes {
      color: #82d6a4;
      font-weight: bold;
    }

    .klein {
      margin-top: 40px;
      color: #b8c5be;
      font-size: 15px;
    }

    a {
      color: #82d6a4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hoi Marco! 👋</h1>
    <p>
      Je wordt nu doorgestuurd naar de
      goede website.
    </p>
    <p class="succes">
      Succes met de stemming!
    </p>
    <p class="klein">
      Je wordt over enkele seconden doorgestuurd.<br>
      <a href="https://www.toolboxridderkerk.nl/stemtool/?dark=1">
        Klik hier als dat niet automatisch gebeurt.
      </a>
    </p>
  </main>
</body>
</html>
